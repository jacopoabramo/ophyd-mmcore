[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ophyd-mmcore"
dynamic = ["version"]
description = "ophyd-async devices for Micro-Manager hardware driven through pymmcore-plus"
readme = "README.md"
authors = [
    { name = "Jacopo Abramo", email = "jacopo.abramo@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "acquire-zarr>=0.10",
    "ophyd-async>=0.21.3",
    "pymmcore-plus>=0.18.1,<0.19",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/ophyd_mmcore"]

[tool.hatch.build.targets.sdist]
include = [
  "src/ophyd_mmcore/**",
]

[dependency-groups]
dev = [
    "prek>=0.5.10",
    "pyright>=1.1.408",
    "pytest>=9",
    "pytest-asyncio>=1.3",
    "ruff>=0.15.4",
    "zarr>=3.1.6",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
fix = true

[tool.ruff.lint]
extend-select = ["D", "I", "TC", "UP", "PLC0415", "E402"]
ignore = ["D100","D104"] # https://docs.astral.sh/ruff/rules/undocumented-public-package/

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
markers = ["demo: needs the Micro-Manager demo adapters"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
